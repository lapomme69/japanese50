<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50음도 맞추기 게임</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f0f4f8; padding: 15px 10px; margin: 0; }
    .card { 
      background: white; 
      padding: 25px 20px; 
      border-radius: 24px; 
      display: inline-block; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 360px; 
      box-sizing: border-box; 
    }
    .toggle-group { margin-bottom: 15px; }
    .mode-btn { 
      padding: 10px 20px; 
      margin: 0 4px; 
      border: 1px solid #cbd5e1; 
      background: #f8fafc; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 16px; 
      color: #475569; 
    }
    .mode-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; font-weight: bold; }
    
    .kana { 
      font-size: 100px; 
      font-weight: bold; 
      color: #1e293b; 
      margin: 10px 0; 
      line-height: 110px; 
      min-height: 110px;
    }
    
    /* 음성 그래프 파형 애니메이션 */
    .wave-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
      gap: 5px;
      margin: 10px 0;
      visibility: hidden;
    }
    .wave-container.active { visibility: visible; }
    .bar {
      width: 6px;
      height: 8px;
      background-color: #4f46e5;
      border-radius: 3px;
      animation: wave 0.8s infinite ease-in-out alternate;
    }
    .bar:nth-child(1) { animation-delay: 0.1s; }
    .bar:nth-child(2) { animation-delay: 0.3s; }
    .bar:nth-child(3) { animation-delay: 0.5s; }
    .bar:nth-child(4) { animation-delay: 0.2s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
      0% { height: 6px; background-color: #818cf8; }
      100% { height: 28px; background-color: #ef4444; }
    }

    .start-btn { 
      font-size: 18px; 
      padding: 16px 28px; 
      border: none; 
      background: #22c55e; 
      color: white; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(34,197,94,0.3); 
      width: 100%;
      transition: all 0.2s;
    }
    .start-btn.listening { background: #ef4444; box-shadow: 0 4px 14px rgba(239,68,68,0.4); }
    
    .timer { margin-top: 10px; font-size: 15px; color: #ef4444; font-weight: bold; min-height: 22px; }
    .status { margin-top: 5px; font-size: 15px; color: #475569; font-weight: bold; min-height: 24px; line-height: 1.4; word-break: keep-all; }
    .result { font-weight: bold; margin-top: 10px; font-size: 18px; min-height: 28px; }
    .remaining { margin-top: 15px; font-weight: bold; color: #64748b; font-size: 14px; background: #f1f5f9; padding: 8px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toggle-group">
      <button class="mode-btn active" onclick="setKanaMode('h', this)">히라가나</button>
      <button class="mode-btn" onclick="setKanaMode('k', this)">가타카나</button>
    </div>
    
    <div class="kana" id="kana">あ</div>
    
    <!-- 음성 수신 파형 그래프 -->
    <div class="wave-container" id="waveContainer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    
    <button class="start-btn" id="startBtn" onclick="startGame()">▶ 게임 시작</button>
    
    <div class="timer" id="timer"></div>
    <div class="status" id="status">[게임 시작]을 누르면 음성 인식이 켜집니다</div>
    <div class="result" id="result"></div>
    
    <div class="remaining">남은 글자: <span id="remCount">46</span> / 46</div>
  </div>

  <script>
    const hData = [
      {k: "あ", a: ["아", "a", "あ"]}, {k: "い", a: ["이", "i", "い"]}, {k: "う", a: ["우", "u", "う"]}, {k: "え", a: ["에", "e", "え"]}, {k: "お", a: ["오", "o", "お"]},
      {k: "か", a: ["카", "ka", "か"]}, {k: "き", a: ["키", "ki", "き"]}, {k: "く", a: ["쿠", "ku", "く"]}, {k: "け", a: ["케", "ke", "け"]}, {k: "こ", a: ["코", "ko", "こ"]},
      {k: "さ", a: ["사", "sa", "사"]}, {k: "し", a: ["시", "shi", "し"]}, {k: "す", a: ["스", "su", "す"]}, {k: "せ", a: ["세", "se", "せ"]}, {k: "そ", a: ["소", "so", "そ"]},
      {k: "た", a: ["타", "ta", "た"]}, {k: "ち", a: ["치", "chi", "ち"]}, {k: "つ", a: ["츠", "tsu", "つ"]}, {k: "て", a: ["테", "te", "て"]}, {k: "と", a: ["토", "to", "と"]},
      {k: "な", a: ["나", "na", "나"]}, {k: "に", a: ["니", "ni", "に"]}, {k: "ぬ", a: ["누", "nu", "ぬ"]}, {k: "ね", a: ["네", "ne", "네"]}, {k: "の", a: ["노", "no", "の"]},
      {k: "は", a: ["하", "ha", "は"]}, {k: "ひ", a: ["히", "hi", "ひ"]}, {k: "ふ", a: ["후", "fu", "ふ"]}, {k: "へ", a: ["헤", "he", "へ"]}, {k: "ほ", a: ["호", "ho", "ほ"]},
      {k: "ま", a: ["마", "ma", "ま"]}, {k: "み", a: ["미", "mi", "み"]}, {k: "む", a: ["무", "mu", "む"]}, {k: "め", a: ["메", "me", "め"]}, {k: "も", a: ["모", "mo", "も"]},
      {k: "や", a: ["야", "ya", "や"]}, {k: "ゆ", a: ["유", "yu", "ゆ"]}, {k: "よ", a: ["요", "yo", "よ"]},
      {k: "ら", a: ["라", "ra", "ら"]}, {k: "り", a: ["리", "ri", "り"]}, {k: "る", a: ["루", "ru", "る"]}, {k: "れ", a: ["레", "re", "れ"]}, {k: "ろ", a: ["로", "ro", "ろ"]},
      {k: "わ", a: ["와", "wa", "わ"]}, {k: "を", a: ["오", "o", "을", "wo"]}, {k: "ん", a: ["응", "n", "ん"]}
    ];

    const kData = [
      {k: "ア", a: ["아", "a", "ア"]}, {k: "イ", a: ["이", "i", "イ"]}, {k: "ウ", a: ["우", "u", "ウ"]}, {k: "エ", a: ["에", "e", "エ"]}, {k: "オ", a: ["오", "o", "オ"]},
      {k: "カ", a: ["카", "ka", "カ"]}, {k: "キ", a: ["키", "ki", "キ"]}, {k: "ク", a: ["쿠", "ku", "ク"]}, {k: "ケ", a: ["케", "ke", "ケ"]}, {k: "コ", a: ["코", "ko", "コ"]},
      {k: "サ", a: ["사", "sa", "サ"]}, {k: "シ", a: ["시", "shi", "シ"]}, {k: "ス", a: ["스", "su", "ス"]}, {k: "セ", a: ["세", "se", "セ"]}, {k: "ソ", a: ["소", "so", "ソ"]},
      {k: "タ", a: ["타", "ta", "タ"]}, {k: "チ", a: ["치", "chi", "チ"]}, {k: "ツ", a: ["츠", "tsu", "ツ"]}, {k: "テ", a: ["테", "te", "テ"]}, {k: "ト", a: ["토", "to", "ト"]},
      {k: "ナ", a: ["나", "na", "ナ"]}, {k: "ニ", a: ["니", "ni", "ニ"]}, {k: "ヌ", a: ["누", "nu", "ヌ"]}, {k: "ネ", a: ["네", "ne", "ネ"]}, {k: "ノ", a: ["노", "no", "ノ"]},
      {k: "ハ", a: ["하", "ha", "ハ"]}, {k: "ヒ", a: ["히", "hi", "ヒ"]}, {k: "フ", a: ["후", "fu", "フ"]}, {k: "ヘ", a: ["헤", "he", "ヘ"]}, {k: "ホ", a: ["호", "ho", "ホ"]},
      {k: "マ", a: ["마", "ma", "マ"]}, {k: "ミ", a: ["미", "mi", "ミ"]}, {k: "ム", a: ["무", "mu", "ム"]}, {k: "メ", a: ["메", "me", "メ"]}, {k: "モ", a: ["모", "mo", "モ"]},
      {k: "ヤ", a: ["야", "ya", "ヤ"]}, {k: "ユ", a: ["유", "yu", "ユ"]}, {k: "ヨ", a: ["요", "yo", "ヨ"]},
      {k: "ラ", a: ["라", "ra", "ラ"]}, {k: "リ", a: ["리", "ri", "リ"]}, {k: "ル", a: ["루", "ru", "ル"]}, {k: "レ", a: ["레", "re", "レ"]}, {k: "ロ", a: ["로", "ro", "ロ"]},
      {k: "ワ", a: ["와", "wa", "ワ"]}, {k: "ヲ", a: ["오", "o", "을", "wo"]}, {k: "ン", a: ["응", "n", "ン"]}
    ];

    let currentList = [];
    let currentItem = null;
    let timerId = null;
    let timeLeft = 4;
    let isGameRunning = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.interimResults = false;

      recognition.onstart = function() {
        document.getElementById("waveContainer").classList.add("active");
        const btn = document.getElementById("startBtn");
        btn.classList.add("listening");
        btn.innerText = "🎙️ 음성 인식 중...";
        document.getElementById("status").innerText = "화면의 글자를 발음하세요!";
      };

      recognition.onresult = function(event) {
        clearTimeout(timerId);
        const transcript = event.results[0][0].transcript.trim();
        processAnswer(transcript);
      };

      recognition.onerror = function() {
        clearTimeout(timerId);
        processAnswer("");
      };

      recognition.onend = function() {
        stopSpeechUI();
      };
    }

    function setKanaMode(mode, btn) {
      clearTimeout(timerId);
      if (recognition) recognition.stop();
      
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const sourceData = mode === 'h' ? hData : kData;
      currentList = [...sourceData];
      
      updateRemainingUI();
      pickNextKana();
      resetUI();
    }

    function resetUI() {
      document.getElementById("startBtn").innerText = "▶ 게임 시작";
      document.getElementById("startBtn").classList.remove("listening");
      document.getElementById("status").innerText = "[게임 시작]을 누르면 음성 인식이 켜집니다";
      document.getElementById("result").innerText = "";
      document.getElementById("timer").innerText = "";
      stopSpeechUI();
    }

    function pickNextKana() {
      if (currentList.length === 0) {
        document.getElementById("kana").innerText = "🎉";
        document.getElementById("result").style.color = "#16a34a";
        document.getElementById("result").innerText = "축하합니다! 모든 글자를 완성하셨습니다!";
        document.getElementById("startBtn").innerText = "🎉 성공 완료";
        document.getElementById("startBtn").disabled = true;
        return false;
      }
      currentItem = currentList[Math.floor(Math.random() * currentList.length)];
      document.getElementById("kana").innerText = currentItem.k;
      return true;
    }

    function updateRemainingUI() {
      document.getElementById("remCount").innerText = currentList.length;
    }

    function startGame() {
      if (!SpeechRecognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다. 구글 크롬 앱을 이용해주세요.");
        return;
      }
      
      if (currentList.length === 0) {
        setKanaMode('h', document.querySelectorAll('.mode-btn')[0]);
      }

      document.getElementById("result").innerText = "";
      startListeningSequence();
    }

    function startListeningSequence() {
      timeLeft = 4;
      document.getElementById("timer").innerText = `남은 시간: ${timeLeft}초`;

      try {
        recognition.start();
      } catch(e) {}

      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          document.getElementById("timer").innerText = `남은 시간: ${timeLeft}초`;
        } else {
          clearInterval(timerId);
          document.getElementById("timer").innerText = "⏰ 시간 초과!";
          if (recognition) recognition.stop();
          processAnswer(""); // 오답 처리
        }
      }, 1000);
    }

    function stopSpeechUI() {
      document.getElementById("waveContainer").classList.remove("active");
      const btn = document.getElementById("startBtn");
      btn.classList.remove("listening");
      btn.innerText = "▶ 시작";
    }

    function speakKana(text) {
      if ('speechSynthesis' in window && text !== "") {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        window.speechSynthesis.speak(utterance);
      }
    }

    function processAnswer(userInput) {
      clearInterval(timerId);
      stopSpeechUI();
      
      const res = document.getElementById("result");
      const cleanInput = userInput.replace(/[\s\.]/g, '').toLowerCase();

      if (cleanInput && currentItem.a.some(ans => cleanInput.includes(ans.toLowerCase()) || ans.toLowerCase().includes(cleanInput))) {
        // 정답
        res.style.color = "#16a34a";
        res.innerText = `⭕ 정답! (인식음: "${userInput}")`;
        
        // 정답 맞춘 글자 차감
        currentList = currentList.filter(item => item.k !== currentItem.k);
        updateRemainingUI();

      } else {
        // 틀림 또는 시간초과
        res.style.color = "#dc2626";
        const readAnswer = currentItem.a[0];
        if (userInput) {
          res.innerText = `❌ 틀렸습니다! (인식음: "${userInput}" / 정답: ${readAnswer})`;
        } else {
          res.innerText = `❌ 시간 초과! (정답: ${readAnswer})`;
        }
        
        speakKana(currentItem.k); // 일본어 원어 음성 재생
      }

      // 다음 문제 준비
      setTimeout(() => {
        if (pickNextKana()) {
          document.getElementById("startBtn").innerText = "▶ 시작";
          document.getElementById("status").innerText = "[시작]을 누르면 다음 문제 음성인식이 작동합니다";
        }
      }, 2000);
    }

    // 최초 초기화
    setKanaMode('h', document.querySelectorAll('.mode-btn')[0]);
  </script>
</body>
</html>
