<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 가나 음성 퀴즈 게임 V12.4</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f0f4f8; padding: 20px; margin: 0; }
    .card { 
      background: white; 
      padding: 25px 20px; 
      border-radius: 16px; 
      display: inline-block; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 360px; 
      box-sizing: border-box; 
    }
    .toggle-group { margin-bottom: 12px; }
    .mode-btn { 
      padding: 8px 16px; 
      margin: 0 4px; 
      border: 1px solid #cbd5e1; 
      background: #f8fafc; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 15px; 
      color: #475569; 
    }
    .mode-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; font-weight: bold; }
    .kana { 
      font-size: 90px; 
      font-weight: bold; 
      color: #1e293b; 
      margin: 10px 0; 
      line-height: 100px; 
      min-height: 100px;
    }
    .btn-large { 
      font-size: 18px; 
      padding: 14px 24px; 
      border: none; 
      border-radius: 30px; 
      cursor: pointer; 
      font-weight: bold; 
      margin: 8px 0;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .start-btn { background: #22c55e; color: white; }
    .start-btn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* 실시간 마이크 음량 감도 반응 파형 그래프 */
    .wave-container {
      width: 100%;
      height: 40px;
      background: #0f172a;
      border-radius: 8px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .wave-bar {
      width: 8px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 4px;
      transition: height 0.05s ease, background-color 0.2s;
    }
    .wave-container.active .wave-bar {
      background-color: #ef4444;
    }

    /* 5초 프로그레스바 및 타이머 */
    .timer-text { font-size: 16px; color: #ef4444; font-weight: bold; margin-top: 4px; min-height: 22px; }
    .progress-container {
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 10px;
      height: 8px;
      margin: 6px 0;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: #ef4444;
      border-radius: 10px;
      transition: width 0.05s linear;
    }

    .status { margin-top: 8px; font-size: 14px; color: #475569; font-weight: bold; min-height: 36px; line-height: 1.4; word-break: keep-all; }
    .debug-text { font-size: 13px; color: #2563eb; margin-top: 4px; font-weight: normal; }
    .result { font-weight: bold; margin-top: 8px; font-size: 18px; min-height: 28px; }
    .score { margin-top: 10px; font-weight: bold; color: #475569; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toggle-group">
      <button class="mode-btn active" onclick="setKanaMode('h', this)">히라가나</button>
      <button class="mode-btn" onclick="setKanaMode('k', this)">가타카나</button>
    </div>
    
    <div class="kana" id="kana">あ</div>
    
    <button class="btn-large start-btn" id="startBtn" onclick="toggleQuiz()">
      ▶ 시작
    </button>
    
    <!-- 실시간 마이크 감도 그래프 -->
    <div class="wave-container" id="waveContainer">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- 타이머 수치 및 진행바 -->
    <div class="timer-text" id="timerText"></div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">[시작] 버튼을 누르면 5초간 음성 인식이 진행됩니다</div>
    <div class="debug-text" id="debugText"></div>
    <div class="result" id="result"></div>
    <div class="score">남은 글자: <span id="score">0</span></div>
  </div>

  <script>
    const hData = [
      {k: "あ", a: ["아", "a", "あ"]}, {k: "い", a: ["이", "i", "い"]}, {k: "う", a: ["우", "u", "う"]}, {k: "え", a: ["에", "e", "え"]}, {k: "お", a: ["오", "o", "お"]},
      {k: "か", a: ["카", "ka", "か"]}, {k: "き", a: ["키", "ki", "き"]}, {k: "く", a: ["쿠", "ku", "く"]}, {k: "け", a: ["케", "ke", "け"]}, {k: "こ", a: ["코", "ko", "こ"]},
      {k: "さ", a: ["사", "sa", "さ"]}, {k: "し", a: ["시", "shi", "し"]}, {k: "す", a: ["스", "su", "す"]}, {k: "せ", a: ["세", "se", "せ"]}, {k: "そ", a: ["소", "so", "そ"]},
      {k: "た", a: ["타", "ta", "た"]}, {k: "ち", a: ["치", "chi", "ち"]}, {k: "つ", a: ["츠", "tsu", "つ"]}, {k: "て", a: ["테", "te", "て"]}, {k: "と", a: ["토", "to", "と"]},
      {k: "な", a: ["나", "na", "나"]}, {k: "に", a: ["니", "ni", "に"]}, {k: "ぬ", a: ["누", "nu", "ぬ"]}, {k: "ね", a: ["네", "ne", "네"]}, {k: "の", a: ["노", "no", "の"]}
    ];

    const kData = [
      {k: "ア", a: ["아", "a", "ア"]}, {k: "イ", a: ["이", "i", "イ"]}, {k: "ウ", a: ["우", "u", "ウ"]}, {k: "エ", a: ["에", "e", "エ"]}, {k: "オ", a: ["오", "o", "オ"]},
      {k: "カ", a: ["카", "ka", "カ"]}, {k: "キ", a: ["키", "ki", "キ"]}, {k: "ク", a: ["쿠", "ku", "ク"]}, {k: "ケ", a: ["케", "ke", "ケ"]}, {k: "コ", a: ["코", "ko", "コ"]},
      {k: "サ", a: ["사", "sa", "サ"]}, {k: "シ", a: ["시", "shi", "シ"]}, {k: "ス", a: ["스", "su", "ス"]}, {k: "セ", a: ["세", "se", "セ"]}, {k: "ソ", a: ["소", "so", "ソ"]},
      {k: "タ", a: ["타", "ta", "タ"]}, {k: "チ", a: ["치", "chi", "チ"]}, {k: "ツ", a: ["츠", "tsu", "ツ"]}, {k: "テ", a: ["테", "te", "テ"]}, {k: "ト", a: ["토", "to", "ト"]},
      {k: "ナ", a: ["나", "na", "ナ"]}, {k: "ニ", a: ["니", "ni", "ニ"]}, {k: "ヌ", a: ["누", "nu", "ヌ"]}, {k: "ネ", a: ["네", "ne", "ネ"]}, {k: "ノ", a: ["노", "no", "ノ"]}
    ];

    let activeQuestions = [...hData];
    let current = null;
    let isListening = false;
    let isAnswered = false;
    let timerInterval = null, timeoutId = null;

    let audioCtx = null, analyser = null, microphone = null, animFrameId = null, mediaStream = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    // 원어민 발음(TTS) 개선 함수
    function speakJapaneseKana(text) {
      if ('speechSynthesis' in window && text !== "") {
        window.speechSynthesis.cancel(); // 이전 재생 음성 초기화
        setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP';
          utterance.rate = 0.8;
          utterance.volume = 1.0;
          window.speechSynthesis.speak(utterance);
        }, 100);
      }
    }

    function initSpeechEngine() {
      if (!SpeechRecognition) return;
      
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onresult = function(event) {
        if (!isListening || isAnswered) return;

        let resultText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          resultText += event.results[i][0].transcript;
        }

        const cleanText = resultText.trim();
        if (cleanText !== "") {
          document.getElementById("debugText").innerText = `인식된 발음: "${cleanText}"`;
          checkAnswer(cleanText);
        }
      };

      recognition.onerror = function(e) {
        console.log("음성인식 에러:", e.error);
        if (e.error === 'no-speech') {
          document.getElementById("debugText").innerText = "소리가 들리지 않습니다. 다시 발음해 주세요.";
        }
      };

      recognition.onend = function() {
        if (isListening && !isAnswered) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function toggleQuiz() {
      if (isListening) {
        stopQuiz();
      } else {
        startQuizSession();
      }
    }

    async function startQuizSession() {
      if (!SpeechRecognition) {
        alert("현재 브라우저가 음성 인식을 지원하지 않습니다.");
        return;
      }

      if (activeQuestions.length === 0) {
        alert("모든 문제를 풀었습니다! 처음부터 다시 시작합니다.");
        resetMode();
        return;
      }

      isListening = true;
      isAnswered = false;

      const startBtn = document.getElementById("startBtn");
      startBtn.innerText = "🎙️ 음성인식 중...";
      startBtn.className = "btn-large start-btn listening";
      document.getElementById("waveContainer").classList.add("active");

      // 실시간 마이크 오디오 음량 분석 시작
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        startAudioVisualizer(mediaStream);
      } catch (err) {
        console.log("마이크 스트림 오류:", err);
        document.getElementById("status").innerText = "❌ 마이크에 연결할 수 없습니다.";
      }

      // 음성 인식 실행
      if (!recognition) initSpeechEngine();
      try { recognition.stop(); } catch(e) {}
      
      setTimeout(() => {
        try {
          recognition.start();
        } catch(e) {
          console.log("인식 시작 에러:", e);
        }
      }, 100);

      run5SecTimer();
    }

    // 실시간 마이크 음량 반응 파형 제어
    function startAudioVisualizer(stream) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        microphone = audioCtx.createMediaStreamSource(stream);

        analyser.fftSize = 32;
        microphone.connect(analyser);

        const bars = document.querySelectorAll('.wave-bar');
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateVolumeBars() {
          if (!isListening) return;
          analyser.getByteFrequencyData(dataArray);

          bars.forEach((bar, index) => {
            const val = dataArray[index % dataArray.length];
            const height = Math.max(6, Math.min(32, (val / 255) * 40));
            bar.style.height = `${height}px`;
          });

          animFrameId = requestAnimationFrame(updateVolumeBars);
        }
        updateVolumeBars();
      } catch (e) {
        console.log("시각화 초기화 실패:", e);
      }
    }

    function stopAudioVisualizer() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();

      const bars = document.querySelectorAll('.wave-bar');
      bars.forEach(bar => bar.style.height = '6px');
    }

    function run5SecTimer() {
      clearQuizTimers();
      document.getElementById("result").innerText = "";
      document.getElementById("debugText").innerText = "음성을 듣는 중...";
      document.getElementById("status").innerText = "🎙️ 5초 안에 발음해 주세요!";

      const pContainer = document.getElementById("progressContainer");
      const pBar = document.getElementById("progressBar");
      const timerText = document.getElementById("timerText");
      
      pContainer.style.display = "block";
      pBar.style.width = "100%";

      const startTime = Date.now();
      const duration = 5000;

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remainingMs = Math.max(0, duration - elapsed);
        const remainingSec = (remainingMs / 1000).toFixed(1);
        
        timerText.innerText = `남은 시간: ${remainingSec}초`;
        pBar.style.width = (remainingMs / duration * 100) + "%";

        if (elapsed >= duration) {
          clearInterval(timerInterval);
        }
      }, 50);

      timeoutId = setTimeout(() => {
        if (!isAnswered) {
          isAnswered = true;
          stopListeningUI();

          const res = document.getElementById("result");
          res.style.color = "#dc2626";
          res.innerText = `⏱️ 시간 초과 / 틀렸습니다! (정답: ${current.a[0]})`;
          document.getElementById("status").innerText = "다음 문제를 푸시려면 [시작]을 누르세요.";

          // 틀렸을 때 원어민 발음 재생
          speakJapaneseKana(current.k);
          prepareNextQuestion();
        }
      }, duration);
    }

    function clearQuizTimers() {
      if (timerInterval) clearInterval(timerInterval);
      if (timeoutId) clearTimeout(timeoutId);
    }

    function stopListeningUI() {
      isListening = false;
      clearQuizTimers();
      stopAudioVisualizer();

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      const startBtn = document.getElementById("startBtn");
      startBtn.innerText = "▶ 시작";
      startBtn.className = "btn-large start-btn";
      
      document.getElementById("waveContainer").classList.remove("active");
      document.getElementById("progressContainer").style.display = "none";
      document.getElementById("timerText").innerText = "";
    }

    function stopQuiz() {
      stopListeningUI();
      document.getElementById("status").innerText = "음성 인식이 중지되었습니다. [시작]을 누르면 진행됩니다.";
    }

    function setKanaMode(mode, btn) {
      stopListeningUI();
      activeQuestions = mode === 'h' ? [...hData] : [...kData];
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      resetMode();
    }

    function resetMode() {
      stopListeningUI();
      if (activeQuestions.length === 0) return;
      prepareNextQuestion();
      document.getElementById("result").innerText = "";
      document.getElementById("debugText").innerText = "";
      document.getElementById("status").innerText = "[시작] 버튼을 누르면 5초간 음성 인식이 진행됩니다";
    }

    function prepareNextQuestion() {
      if (activeQuestions.length === 0) {
        document.getElementById("kana").innerText = "🎉";
        document.getElementById("result").style.color = "#16a34a";
        document.getElementById("result").innerText = "축하합니다! 모든 단어를 암기하셨습니다!";
        document.getElementById("status").innerText = "다시 풀려면 상단의 [히라가나/가타카나] 버튼을 눌러주세요.";
        document.getElementById("score").innerText = "0";
        return;
      }

      current = activeQuestions[Math.floor(Math.random() * activeQuestions.length)];
      document.getElementById("kana").innerText = current.k;
      document.getElementById("score").innerText = activeQuestions.length;
    }

    function checkAnswer(userInput) {
      const cleanInput = userInput.replace(/[\s\.]/g, '').toLowerCase();
      if (!cleanInput) return;

      const isCorrect = current.a.some(ans => cleanInput.includes(ans.toLowerCase()) || ans.toLowerCase().includes(cleanInput));

      if (isCorrect && !isAnswered) {
        isAnswered = true;
        stopListeningUI();

        activeQuestions = activeQuestions.filter(q => q.k !== current.k);

        const res = document.getElementById("result");
        res.style.color = "#16a34a";
        res.innerText = "⭕ 정답입니다! 🎉";
        document.getElementById("status").innerText = "다음 문제를 푸시려면 [시작]을 누르세요.";
        document.getElementById("score").innerText = activeQuestions.length;

        // 맞았을 때 원어민 발음 재생
        speakJapaneseKana(current.k);
        prepareNextQuestion();
      }
    }

    prepareNextQuestion();
  </script>
</body>
</html>
